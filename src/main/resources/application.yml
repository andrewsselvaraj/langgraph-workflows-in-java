spring:
  application:
    name: langgraph-workflows-in-java
  # Keys can live in a local .env file (KEY=value), like python-dotenv. See .env.example.
  config:
    import: optional:file:.env[.properties]
  main:
    banner-mode: off
  ai:
    # Spring AI's OpenAI client. Cerebras and Ollama both expose an OpenAI-compatible API:
    #   Cerebras (default, as in the Python repo): https://api.cerebras.ai/v1   model gpt-oss-120b
    #   Ollama:                                    http://localhost:11434/v1    model gpt-oss:20b
    openai:
      base-url: ${LLM_BASE_URL:https://api.cerebras.ai/v1}
      api-key: ${CEREBRAS_API_KEY:${LLM_API_KEY:not-set}}
      timeout: 120s
      chat:
        model: ${LLM_MODEL:gpt-oss-120b}
    # Only the chat model comes from OpenAI; embeddings run locally (see AiConfig).
    model:
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none

server:
  port: ${PORT:8080}

app:
  output-dir: ${OUTPUT_DIR:output}
  tavily:
    api-key: ${TAVILY_API_KEY:}
    max-results: 3
  wordpress:
    url: ${WORDPRESS_URL:}
    username: ${WORDPRESS_USERNAME:}
    password: ${WORDPRESS_PASSWORD:}
  github:
    token: ${GITHUB_TOKEN:}
    repo-name: coding-agent-output
  shell:
    allowed-commands:
      - ls -l
      - dir
      - git status
      - java -version

logging:
  level:
    org.bsc.langgraph4j: WARN
